<!doctype html>
<html lang="es-BO" data-base="{{ base }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'self'">
<title>{{ M.titulo }}</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="{{ abs_url('/') }}">
<link rel="stylesheet" href="{{ estatico('/css/estilos.css') }}">
</head>
<body class="embed">
<div class="embed-box">
  <div class="e-fila"><span class="e-et">Dólar paralelo</span><span class="e-val">Bs {{ D.usdt.valor_txt }}</span></div>
  <div class="e-fila"><span class="e-et">Oficial BCB</span><span class="e-val">Bs {{ D.tco.venta_txt }}</span></div>
  <p class="e-pie">Actualizado {{ D.usdt.hora }} · {{ D.usdt.fecha_corta }} · Fuente: <a href="{{ abs_url('/') }}" target="_blank" rel="noopener">{{ S.nombre }}</a></p>
</div>
</body>
</html>
