# Avisa con un pull request cuando hay versiones nuevas (o parches de
# seguridad) de las librerías de Python y de las acciones de GitHub.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
